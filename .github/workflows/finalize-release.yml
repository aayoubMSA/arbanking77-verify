name: Finalize exact ArBanking77-Verify release tree

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair and verify exact fragment 2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          s = Path('.staging/release.zip.b64.2').read_text(encoding='utf-8')
          assert len(s) == 6500, len(s)
          s = s[:3232] + 'sZfxKRSeRiMVBUEhyq3RoadGNDLKcpBW' + s[3264:]
          digest = hashlib.sha256(s.encode('ascii')).hexdigest()
          print('CORRECTED_FRAG2_SHA256', digest)
          assert digest == 'e19486a3fb3c4715bdee65bc5ea34d4ea7c521812fd3b20cde774deba81ece5c'
          Path('/tmp/release.zip.b64.2').write_text(s, encoding='ascii')
          PY

      - name: Reconstruct and verify approved release ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/release.zip.b64.1 \
              /tmp/release.zip.b64.2 \
              .staging/release.zip.b64.3 \
              .staging/release.zip.b64.4 | base64 --decode > /tmp/ArBanking77-Verify-v0.1.0.zip
          echo '5c097a9ef3b809a762da856cc69d727af6eb10aa0dbd2c8671440596f6991534  /tmp/ArBanking77-Verify-v0.1.0.zip' | sha256sum -c -
          rm -rf /tmp/arbanking77-release
          mkdir -p /tmp/arbanking77-release
          unzip -q /tmp/ArBanking77-Verify-v0.1.0.zip -d /tmp/arbanking77-release
          test "$(find /tmp/arbanking77-release/ArBanking77-Verify-v0.1.0 -type f | wc -l)" -eq 14
          cd /tmp/arbanking77-release/ArBanking77-Verify-v0.1.0
          sha256sum -c MANIFEST.sha256

      - name: Replace staging tree with exact 14-file release payload
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/arbanking77-release/ArBanking77-Verify-v0.1.0/. .
          rm -rf .github
          test "$(find . -type f ! -path './.git/*' | wc -l)" -eq 14
          sha256sum -c MANIFEST.sha256
          python -m unittest -v tests/test_arbanking77_verify.py

      - name: Commit exact approved payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ahmed Ayoub Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --name-status
          git commit -m 'Publish exact ArBanking77-Verify v0.1.0 approved payload'
          git push origin HEAD:main
